<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Practice Sheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 8.5in;
            height: 11in;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-area {
            position: relative;
            height: 100%;
            overflow-y: auto;
        }

        /* Handwriting lines */
        .line {
            position: relative;
            height: 40px;
            margin-bottom: 0;
            border-bottom: 2px solid #2196F3;
            display: flex;
            align-items: center;
        }

        .line::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: repeating-linear-gradient(
                90deg,
                #FFB3BA 0px,
                #FFB3BA 2px,
                transparent 2px,
                transparent 6px
            );
            opacity: 0.5;
            transform: translateY(-1px);
        }

        .line input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-family: 'Comic Sans MS', cursive;
            font-size: 28px;
            color: #333;
            outline: none;
            padding: 0 10px;
            resize: none;
        }

        .line input::placeholder {
            color: #ddd;
            font-style: italic;
        }

        .line input:focus {
            background: rgba(102, 126, 234, 0.05);
        }

        .footer {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #ccc;
            font-size: 11px;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                height: auto;
                max-width: 100%;
                border-radius: 0;
            }

            .line input {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .footer {
                display: none;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                height: auto;
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .line {
                height: 35px;
            }

            .line input {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Handwriting Practice</h1>
            <p>Write one line per row</p>
        </div>

        <div class="practice-area">
            <div class="line">
                <input type="text" placeholder="A a B b C c D d E e...">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
            <div class="line">
                <input type="text" placeholder="">
            </div>
        </div>

        <div class="footer">🌟 Great job practicing!</div>
    </div>
</body>
</html>
